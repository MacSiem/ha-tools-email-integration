name: ha-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: '2024.7.0'
            python: '3.12'
            harness: '0.13.144'
            extra: 'josepy==1.14.0'
          - core: '2026.10.1'
            python: '3.14'
            harness: '0.13.372'
          - core: '2026.10.0b4'
            python: '3.14'
            harness: '0.13.370'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant test harness
        env:
          # Reconstruct Core's declared minimum-version environment. ACME2.x
          # additionally needs pre-2.0 josepy (ComparableX509 was removed).
          PIP_CONSTRAINT: ${{ matrix.core == '2024.7.0' && 'https://raw.githubusercontent.com/home-assistant/core/2024.7.0/homeassistant/package_constraints.txt' || '' }}
        run: |
          pip install "pytest-homeassistant-custom-component==${{ matrix.harness }}" ${{ matrix.extra }}
          python - <<'PYVER'
          from homeassistant.const import __version__
          assert __version__ == '${{ matrix.core }}', __version__
          PYVER
          # Requirements of core integrations this integration depends on (recorder).
          pip install $(python - <<'PY'
          import json, os, homeassistant
          base = os.path.join(os.path.dirname(homeassistant.__file__), "components")
          reqs = set()
          for name in ("recorder",):
              reqs.update(json.load(open(os.path.join(base, name, "manifest.json"))).get("requirements", []))
          print(" ".join(sorted(reqs)))
          PY
          )
      - name: Integration inside a real Home Assistant core
        run: python -m pytest tests_ha -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -p no:cacheprovider
